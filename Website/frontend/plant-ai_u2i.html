<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planticia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      border: 5px solid #8B4513; /* Thinner brown border */
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      margin-top: 20px;
      color: #2c3e50;
    }

    .image-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }

    .image-label {
      font-size: 1.5rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 200px;
      height: 200px;
      border: 5px dashed #2c3e50;
      border-radius: 10px;
      background-color: #ffffff;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 5px;
    }

    .button-container {
      display: flex;
      justify-content: space-evenly;
      padding: 10px 20px;
    }

    button {
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 45%;
      transition: all 0.3s ease;
    }

    .green-btn {
      background-color: #4CAF50;
      color: white;
    }

    .green-btn:hover {
      background-color: #45a049;
    }

    .yellow-btn {
      background-color: #FFD700;
      color: #333;
    }

    .yellow-btn:hover {
      background-color: #FFC107;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      button {
        font-size: 16px;
        padding: 15px;
        width: 40%;
      }
    }
  </style>
</head>
<body>
  <h1>Planticia</h1>
  <div class="image-section">
    <div class="image-label">Plant Image ( via HTTP Request)</div>
    <div class="image-container">
      <img id="plant-image" src="" alt="Plant will appear here">
    </div>
  </div>
  <div class="button-container">
    <button id="water-btn" class="green-btn">Water the Plant</button>
    <button id="light-btn" class="yellow-btn">Turn On LED Grow Light</button>
  </div>
  <script>
    async function sendRequest(url, action) {
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ action })
        });
        const result = await response.json();
        alert(result.message);
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    document.getElementById("water-btn").addEventListener("click", function () {
      sendRequest("/api/water-plant", "water");
    });

    document.getElementById("light-btn").addEventListener("click", function () {
      sendRequest("/api/turn-on-light", "light");
    });

    // Dynamically set the plant image
    function setPlantImage(url) {
      const imgElement = document.getElementById("plant-image");
      imgElement.src = url;
    }

   
    setPlantImage("https://via.placeholder.com/400"); // Replace this URL with the actual plant image URL
  </script>
</body>
</html>
